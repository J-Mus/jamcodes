<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #333;
            --bg: #f9f9f9;
            --card-bg: #fff;
            --accent: #0056b3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--primary);
        }
        /* Filter Header */
        #filter-bar {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 10px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            z-index: 100;
        }
        .filter-btn {
            background: #eee;
            border: none;
            padding: 8px 16px;
            margin: 4px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .filter-btn.active {
            background: var(--accent);
            color: white;
        }
        
        /* Grid Layout */
        #project-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .tag {
            font-size: 12px;
            background: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 4px;
            text-transform: uppercase;
        }

        /* Detail View */
        #project-detail {
            display: none;
            position: relative;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            min-height: 80vh;
        }
        .proj-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.95);
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 14px;
        }
        #prev-project-btn { left: 10px; }
        #next-project-btn { right: 10px; }
        #back-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 16px;
            padding: 0 0 20px 0;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="filter-bar">
        <button class="filter-btn" data-tag="art">Art</button>
        <button class="filter-btn" data-tag="music">Music</button>
        <button class="filter-btn" data-tag="code">Code</button>
        <button class="filter-btn" data-tag="design">Design</button>
        <button class="filter-btn" data-tag="collab">Collab</button>
        <button class="filter-btn" id="reset-btn" style="background: #ccc;">Reset</button>
    </div>

    <div id="project-grid"></div>

    <div id="project-detail">
        <button id="prev-project-btn" class="proj-nav" aria-label="Older project">← Older</button>
        <button id="next-project-btn" class="proj-nav" aria-label="Newer project">Newer →</button>
        <button id="back-btn">← Back to projects</button>
        <h1 id="detail-title"></h1>
        <div id="detail-tags" style="margin-bottom: 20px;"></div>
        <div id="detail-content" style="line-height: 1.6;"></div>
    </div>

    <script>
        // 1. Your Project Database
        const projects = [
            {
                id: "pastel-system",
                date: "2026-05-11",
                title: "Pastel Colour System",
                tags: ["art", "design"],
                summary: "A practical colour and material study system.",
                content: "Here is the full write-up for the Pastel project. You can use standard HTML here like <br> or <b>bold text</b>."
            },
            {
                id: "harmony-map",
                date: "2026-03-11",
                title: "Harmony Map",
                tags: ["music", "code", "collab"],
                summary: "An interactive visualization of music theory.",
                content: "Full project details about the Harmony Map..."
            },
            {
                id: "urban-study",
                date: "2025-11-05",
                title: "Urban Architecture Study",
                tags: ["art"],
                summary: "Sketches of historical urban engineering.",
                content: "Full write up..."
            }
        ];

        // 2. Application Logic
        let activeTags = new Set();
        const grid = document.getElementById('project-grid');
        const detailView = document.getElementById('project-detail');
        const filterBar = document.getElementById('filter-bar');

        // Render the grid based on active filters
        function renderGrid() {
            grid.innerHTML = '';
            const sorted = [...projects].sort((a, b) => new Date(b.date) - new Date(a.date));
            // Filter logic: Show if project has ALL active tags (or if no tags active)
            const filtered = sorted.filter(p => {
                if (activeTags.size === 0) return true;
                return [...activeTags].every(tag =>p.tags.includes(tag));
            });

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openProject(p.id);
                
                const tagsHtml = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
                
                card.innerHTML = `
                    <h3>${p.title}</h3>
                    <p style="color: #999; font-style: italic; font-size: 13px; margin: 4px 0 10px 0;">${p.date}</p>
                    <div style="margin-bottom: 10px;">${tagsHtml}</div>
                    <p>${p.summary}</p>
                `;
                grid.appendChild(card);
            });
        }

        // Open a specific project and wire prev/next navigation
        function getSortedProjects() {
            return [...projects].sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function openProject(id) {
            const sorted = getSortedProjects();
            const index = sorted.findIndex(x => x.id === id);
            if (index === -1) return;
            const p = sorted[index];

            // Hide grid and filters, show detail
            grid.style.display = 'none';
            filterBar.style.display = 'none';
            detailView.style.display = 'block';

            // Populate detail view (include date)
            document.getElementById('detail-title').innerText = p.title;
            document.getElementById('detail-tags').innerHTML = `<p style="color: #999; font-style: italic; margin: 0 0 8px 0;">${p.date}</p>` + p.tags.map(t => `<span class="tag">${t}</span>`).join('');
            document.getElementById('detail-content').innerHTML = p.content;

            // Prev / Next buttons
            const prevBtn = document.getElementById('prev-project-btn');
            const nextBtn = document.getElementById('next-project-btn');
            const older = sorted[index + 1]; // older project (later index)
            const newer = sorted[index - 1]; // newer project (earlier index)

            if (older) {
                prevBtn.style.display = 'block';
                prevBtn.onclick = () => openProject(older.id);
            } else {
                prevBtn.style.display = 'none';
            }

            if (newer) {
                nextBtn.style.display = 'block';
                nextBtn.onclick = () => openProject(newer.id);
            } else {
                nextBtn.style.display = 'none';
            }

            // Scroll to top safely
            window.scrollTo(0,0);
        }

        // Close project and return to exact filter state
        document.getElementById('back-btn').onclick = () => {
            detailView.style.display = 'none';
            grid.style.display = 'grid';
            filterBar.style.display = 'block';
        };

        // Handle Filter Clicks
        document.querySelectorAll('.filter-btn:not(#reset-btn)').forEach(btn => {
            btn.onclick = (e) => {
                const tag = e.target.getAttribute('data-tag');
                if (activeTags.has(tag)) {
                    activeTags.delete(tag);
                    e.target.classList.remove('active');
                } else {
                    activeTags.add(tag);
                    e.target.classList.add('active');
                }
                renderGrid();
            };
        });

        // Handle Reset
        document.getElementById('reset-btn').onclick = () => {
            activeTags.clear();
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            renderGrid();
        };

        // Initialize
        renderGrid();
    </script>
</body>
</html>
