<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pastel Colour System | jamcodes</title>

        <meta
            name="description"
            content="A practical colour and material study system."
        >
    <style>
        :root {
            /* Adjust this value to line the chevron up with Projects. */
            --callout-right-offset: 18px;

            --callout-red: #dc143c;
            --callout-text: #fff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Helvetica, Arial, sans-serif;
        }

        /*
         * This outer flexbox positions the rectangle on the right, beneath
         * the existing Projects navigation button.
         */
        #projects-pointer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 6px var(--callout-right-offset) 6px 6px;
        }

        /*#projects-pointer-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 10px 14px;
            background: var(--callout-red);
            color: var(--callout-text);
            border-radius: 4px;

            font-size: 14px;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
            user-select: none;
        }*/
        
        #projects-pointer-box {
        display: inline-flex;
    align-items: center;
    gap: 6px;

    color: #333;
    line-height: 1;
    white-space: nowrap;
    user-select: none;
}

#project-content {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 64px;
}

.project-date {
    color: #999;
    font-style: italic;
}

.project-tags {
    margin-bottom: 24px;
}

.tag {
    display: inline-block;
    margin-right: 4px;
    padding: 4px 8px;
    background: #e0e0e0;
    border-radius: 4px;
    font-size: 12px;
    text-transform: uppercase;
}

        #projects-pointer-chevron {
            display: inline-block;
            font-size: 20px;
            line-height: 1;

            animation: move-chevron-up 1.1s ease-in-out infinite;
        }

        @keyframes move-chevron-up {
            0%,
            100% {
                transform: translateY(3px);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        /* Respect visitors who have requested reduced motion. */
        @media (prefers-reduced-motion: reduce) {
            #projects-pointer-chevron {
                animation: none;
            }
        }


        
    </style>
</head>

<body>
    <div id="projects-pointer">
        <div
    id="projects-pointer-box"
    role="note"
    aria-label="Use the Projects navigation above to explore all projects"
>
    <span>Explore all projects</span>

    <span
        id="projects-pointer-chevron"
        aria-hidden="true"
    >
        ⌃
    </span>
</div>
    </div>

    <main id="project-page">
        <h1>Pastel Colour System</h1>

        <p>11 May 2026</p>

        <div class="project-tags">
            <span class="tag">Art</span>
            <span class="tag">Design</span>
        </div>

        <article id="project-content">
            <p>
                This is the complete Pastel Colour System
                project write-up.
            </p>

            <h2>Development</h2>

            <p>
                Further project content goes here.
            </p>
        </article>
    </main>
</body>
</html>
