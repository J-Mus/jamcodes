<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #333;
            --bg: #f9f9f9;
            --card-bg: #fff;
            --accent: #0056b3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--primary);
        }
        /* Filter Header */
#filter-bar {
    display: flex;
    flex-wrap: nowrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    margin-bottom: 20px;
    border-bottom: 1px solid #ddd;
    z-index: 100;
}

        #filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            flex: 1 1 auto;
            min-width: 0;
        }

#filter-nav {
    display: none;             /* hidden on the main grid */
    flex: 0 0 198px;           /* fixed slot width for two 95px buttons + 8px gap */
    justify-content: space-between;
    align-items: center;
    white-space: nowrap;
    margin-left: auto;         /* keeps the whole slot on the right */
}

        .filter-btn {
            background: #eee;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .filter-btn.active {
            background: var(--accent);
            color: white;
        }
        .filter-btn.flash {
            background:#fff;
            color: #333;
            box-shadow: 0 0 0 2px #ccc inset;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        
        /* Grid Layout */
        #project-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .card {
            display: block;
            color: inherit;
            text-decoration: none;

            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-content-sentence {
            max-height: 0;
            margin: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateY(5px);

            transition:
                max-height 0.25s ease,
                margin 0.25s ease,
                opacity 0.25s ease,
                transform 0.25s ease;
            }

        .card:hover .card-content-sentence,
        .card:focus-visible .card-content-sentence {
                max-height: 100px;
                 margin-top: 12px;
                opacity: 1;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .tag {
            font-size: 12px;
            background: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 4px;
            text-transform: uppercase;
        }

        /* Detail View */
        #project-detail {
            display: none;
            position: relative;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            min-height: 80vh;
        }

/* Grouped button styles for cleaner code */
#old-project-btn, #new-project-btn { 
    background: #dc143c;
    color: white;
    border: none;
    padding: 8px 16px;
    margin: 0;                 /* Removed individual margins; 'gap' in the parent handles this now */
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
    width: 95px;
    flex-shrink: 0;            /* Prevents the buttons from squishing if the screen gets too small */
}

/* Slot alignment rules */
#old-project-btn {
    margin-right: auto;        /* Forces button to stay in the left "slot" */
}

#new-project-btn {
    margin-left: auto;         /* Forces button to stay in the right "slot" */
}

#old-project-btn:hover, #new-project-btn:hover {
    background: #b21030;
}

        #back-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 16px;
            padding: 0 0 20px 0;
            text-decoration: underline;
        }
        #reset-btn {
            background: #ccc;
            color: #333;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        #reset-btn.flash {
            background: #fff;
            color: #111;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), 0 0 0 6px rgba(0, 0, 0, 0.1);
        }

        #message-no-projects-to-display {
            display: none;
        }

        #message-project-currently-filtered {
            display: none;
            color: #668;
            font-style: italic;
            margin: 8px 0;
        }

        /* for mobile  */
        @media (hover: none) {
    .card-content-sentence {
        max-height: 100px;
        margin-top: 12px;
        opacity: 1;
        transform: none;
    }
}

    </style>
</head>
<body>

    

    <div id="filter-bar">
        <div id="filter-buttons">
            <button class="filter-btn" data-tag="art">Art</button>
            <button class="filter-btn" data-tag="music">Music</button>
            <button class="filter-btn" data-tag="code">Code</button>
            <button class="filter-btn" data-tag="design">Design</button>
            <button class="filter-btn" data-tag="collab">Collab</button>
            <button class="filter-btn" id="reset-btn">Reset</button>
        </div>
        <div id="filter-nav">
            <button id="old-project-btn" style="display:none;">← Older</button>
            <button id="new-project-btn" style="display:none;">Newer →</button>
        </div>
    </div>

<div id="search-bar" style="margin-bottom: 20px;">
  <input
    type="text"
    id="search-input"
    placeholder="Search projects..."
    style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;"
  >
</div>

    <div id="project-grid"></div>

    <div id="project-detail">

        <button id="back-btn">← Back to projects</button>

        <h1 id="detail-title"></h1>
        <div id="message-project-currently-filtered" style="display:none; color:#668; font-style:italic; margin:8px 0;">
            No projects match the active filters.
        </div>

        <div id="detail-tags" style="margin-bottom: 20px;"></div>
        <div id="detail-content" style="line-height: 1.6;"></div>
    </div>

    <div id="message-no-projects-to-display">
        No projects exist with the project type tags selected.
    </div>

    <script>
        // 1. Your Project Database
        const projects = [
            {
                id: "pastelSystem",
                date: "2026-05-11",
                title: "Pastel Colour System",
                tags: ["art", "design"],
                summary: "A practical colour and material study system.",

                content: "",
                searchText: "",
                contentLoaded: false,

                detailUrl: "./pastel-system/"
            },
            {
                id: "guitarToPiano",
                date: "2024-03-24",
                title: "guitar to piano",
                tags: ["code", "music"],
                summary: "note finder from guitar to piano, prototyped in google sheets",

                content: "",
                searchText: "",
                contentLoaded: false,
                
                detailUrl: "./guitar-to-piano/"
            },
            {
                id: "urbanStudy",
                date: "2025-11-05",
                title: "Urban Architecture Study",
                tags: ["art"],
                summary: "Sketches of historical urban engineering.",
   
                content: "",
                searchText: "",
                contentLoaded: false,
                
                detailUrl: "./urban-study/"
            }
        ];

        async function loadProjectContent(project) {
    if (project.contentLoaded) {
        return;
    }

    try {
        const response = await fetch(project.detailUrl);

        if (!response.ok) {
            throw new Error(
                `Could not load ${project.detailUrl}`
            );
        }

        const pageHtml = await response.text();

        const pageDocument =
            new DOMParser().parseFromString(
                pageHtml,
                "text/html"
            );

        const projectContent =
            pageDocument.getElementById(
                "project-content"
            );

        if (!projectContent) {
            throw new Error(
                `#project-content was not found in ${project.detailUrl}`
            );
        }

        project.content = projectContent.innerHTML;

        project.searchText =
            projectContent.textContent
                .trim()
                .toLowerCase();

        project.contentLoaded = true;

    } catch (error) {
        console.error(error);

        project.content = `
            <p>
                Sorry, this project could not be loaded.
            </p>
        `;

        project.searchText = "";
    }
}

// setting the format of displayed dates
function formatProjectDateForDisplay(projectDateIso) {
    const projectDate = new Date(
        `${projectDateIso}T00:00:00Z`
    );

    return new Intl.DateTimeFormat('en-GB', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        timeZone: 'UTC'
    }).format(projectDate);
}

        // 2. Application Logic
        let activeTags = new Set();
        let currentProjectId = null;
        const grid = document.getElementById('project-grid');
        const detailView = document.getElementById('project-detail');
        const filterBar = document.getElementById('filter-bar');

        // Render the grid based on active filters
        function renderGrid() {
            grid.innerHTML = '';
            const filtered = getVisibleProjects();
            const messageNoProjectstoDisplay = document.getElementById('message-no-projects-to-display');
            
            if (filtered.length === 0) {
                messageNoProjectstoDisplay.style.display = 'block';     // show message element as a block 
            } else {
                messageNoProjectstoDisplay.style.display = 'none';      // don't show message element as a blockat all   
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openProject(p.id);
                
                const tagsHtml = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
                
                card.innerHTML = `
                    <h3>${p.title}</h3>
                    <p style="color: #999; font-style: italic; font-size: 13px; margin: 4px 0 10px 0;">${formatProjectDateForDisplay(p.date)}</p>
                    <div style="margin-bottom: 10px;">${tagsHtml}</div>
                    <p class="card-content-sentence">
                    ${p.summary}
                    </p>
                `;
                grid.appendChild(card);
            });
        }

        // Open a specific project and wire old/new navigation
        // creates a copy of the projects array before then sorting (to not mutate the original array) and then filtering based on active tags

        const searchInput = document.getElementById('search-input'); // for a search bar

        function getVisibleProjects() {


            // for filtering and search bar
              const query = searchInput.value.trim().toLowerCase();
  return projects
    .filter(p => {
      //const matchesTags = activeTags.size === 0 || p.tags.some(tag => activeTags.has(tag));     //or
      const matchesTags = activeTags.size === 0 || Array.from(activeTags).every(tag => p.tags.includes(tag));       // and - reduce number of projects displayed
      const matchesSearch = !query ||
        p.title.toLowerCase().includes(query) ||
        p.summary.toLowerCase().includes(query) ||
        (p.searchText ?? "").includes(query) ||
        p.tags.some(tag => tag.toLowerCase().includes(query));
      return matchesTags && matchesSearch;
    })
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}
        searchInput.addEventListener(
    'input',
    updateViewAfterCriteriaChange
);

        function showFilteredProjectMessage() {
            const filteredNote = document.getElementById('message-project-currently-filtered');
            const oldBtn = document.getElementById('old-project-btn');
            const newBtn = document.getElementById('new-project-btn');

            document.getElementById('detail-title').innerText = '';
            document.getElementById('detail-tags').style.display = 'none';
            document.getElementById('detail-content').style.display = 'none';

            document.getElementById('filter-nav').style.display = 'none';

            filteredNote.style.display = 'block';
            oldBtn.style.display = 'none';
            newBtn.style.display = 'none';
        }

        async function openProject(id, shouldScroll = true) {
            currentProjectId = id;
            const visible = getVisibleProjects();
            const index = visible.findIndex(x => x.id === id);




            grid.style.display = 'none';
            filterBar.style.display = 'flex';
            document.getElementById('filter-nav').style.display = 'flex';
            detailView.style.display = 'block';

            if (index === -1) {
                showFilteredProjectMessage();
                return;
            }

            const p = visible[index];
            document.getElementById('detail-content').innerHTML = '<p>Loading project…</p>';
            await loadProjectContent(p);
            document.getElementById('detail-title').innerText = p.title;
            document.getElementById('detail-tags').style.display = 'block';
            document.getElementById('detail-content').style.display = 'block';
            document.getElementById('message-project-currently-filtered').style.display = 'none';

            document.getElementById('detail-tags').innerHTML = `<p style="color: #999; font-style: italic; margin: 0 0 8px 0;">${formatProjectDateForDisplay(p.date)}</p>` + p.tags.map(t => `<span class="tag">${t}</span>`).join('');
            document.getElementById('detail-content').innerHTML = p.content;

            

            updateDetailNav(id);
            if (shouldScroll) {
            window.scrollTo(0, 0);
            }
        }

        function updateDetailNav(currentId) {
            const visible = getVisibleProjects();
            const index = visible.findIndex(p => p.id === currentId);
            const oldBtn = document.getElementById('old-project-btn');
            const newBtn = document.getElementById('new-project-btn');

            if (index === -1) {
                oldBtn.style.display = 'none';
                newBtn.style.display = 'none';
                return;
            }

            const older = visible[index + 1];
            const newer = visible[index - 1];

            if (older) {
                oldBtn.style.display = 'block';
                oldBtn.onclick = () => openProject(older.id);
            } else {
                oldBtn.style.display = 'none';
            }

            if (newer) {
                newBtn.style.display = 'block';
                newBtn.onclick = () => openProject(newer.id);
            } else {
                newBtn.style.display = 'none';
            }
        }

        function hideProjectDetails() {
            detailView.style.display = 'none';
        }

        function showProjectDetails() {
            detailView.style.display = 'block';
        }

        function renderCurrentProjectDetail(id) {
            const p = projects.find(x => x.id === id);
            if (!p) return;

            document.getElementById('detail-title').innerText = p.title;
            document.getElementById('detail-tags').style.display = 'block';
            document.getElementById('detail-content').style.display = 'block';
            document.getElementById('detail-tags').innerHTML = `<p style="color:#999; font-style:italic; margin: 0 0 8px 0;">${formatProjectDateForDisplay(p.date)}</p>` + p.tags.map(t =>`<span class="tag">${t}</span>`).join('');
            document.getElementById('detail-content').innerHTML = p.content;
        }

        // project only forgotten if user explicitly leaves it
        document.getElementById('back-btn').onclick = () => {
            currentProjectId = null;
            detailView.style.display = 'none';
            grid.style.display = 'grid';

            renderGrid();




            // ensure filters are visible
            filterBar.style.display = 'flex';
            document.getElementById('filter-nav').style.display = 'none';
            // hide the nav buttons in the header
            const oldBtn = document.getElementById('old-project-btn');
            const newBtn = document.getElementById('new-project-btn');
            if(oldBtn) oldBtn.style.display = 'none';
            if(newBtn) newBtn.style.display = 'none';
        };

        function updateViewAfterCriteriaChange() {
    renderGrid();

    // The user is currently looking at the project grid.
    if (!currentProjectId) {
        return;
    }

    const visible = getVisibleProjects();

    const currentProject = visible.find(
        project => project.id === currentProjectId
    );

    // Keep the current project if possible.
    // Otherwise use the newest matching project.
    const projectToShow = currentProject || visible[0];

    if (projectToShow) {
    const projectChanged =
        projectToShow.id !== currentProjectId;

    openProject(projectToShow.id, projectChanged);
} else {
        showFilteredProjectMessage();

        document.getElementById(
            'message-no-projects-to-display'
        ).style.display = 'none';
    }
}

        // Handle Filter Clicks
document
    .querySelectorAll('.filter-btn:not(#reset-btn)')
    .forEach(btn => {
        btn.onclick = (event) => {
            const tag = event.target.getAttribute('data-tag');

            if (activeTags.has(tag)) {
                activeTags.delete(tag);
                event.target.classList.remove('active');
            } else {
                activeTags.add(tag);
                event.target.classList.add('active');
            }

            updateViewAfterCriteriaChange();
        };
    });

        // Handle Reset
        const resetBtn = document.getElementById('reset-btn');

            resetBtn.onclick = () => {
    activeTags.clear();
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    resetBtn.classList.add('flash');
    setTimeout(() => resetBtn.classList.remove('flash'), 260);
    updateViewAfterCriteriaChange();
        };

    // load every project content for full-content search
    async function loadAllProjectContent() {
    await Promise.all(
        projects.map(project =>
            loadProjectContent(project)
        )
    );

    updateViewAfterCriteriaChange();
}

        // Initialize
        renderGrid();
loadAllProjectContent();
    </script>
</body>
</html>
